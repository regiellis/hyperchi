version: '3'

# Homelab search: a read-only search over a directory of documents. Templates
# and static files are embedded; LIBRARY_DIR and DB_PATH are relative to the
# working directory. Per the repo rule, examples run with `go run` or Air;
# nothing here builds a binary by hand.
# Override the port or library: task dev PORT=9000 LIBRARY_DIR=/srv/docs

vars:
  PORT: '{{.PORT | default "8080"}}'
  LIBRARY_DIR: '{{.LIBRARY_DIR | default "library"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Run with Air hot reload on 0.0.0.0:{{.PORT}} (rebuilds on .go, .tmpl, .css, .js edits)
    env:
      PORT: '{{.PORT}}'
      LIBRARY_DIR: '{{.LIBRARY_DIR}}'
    cmds:
      - air

  run:
    desc: Run without hot reload on 0.0.0.0:{{.PORT}}
    env:
      PORT: '{{.PORT}}'
      LIBRARY_DIR: '{{.LIBRARY_DIR}}'
    cmds:
      - go run .

  test:
    desc: Run every test with the race detector
    cmds:
      - go test -race -count=1 -cover ./...

  fuzz:
    desc: Fuzz the query sanitizer for 30 seconds
    cmds:
      - go test -run '^$' -fuzz FuzzMatchExpr -fuzztime 30s .

  lint:
    desc: Check formatting, vet, and golangci-lint
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - golangci-lint run ./...

  check:
    desc: Lint, then test
    cmds:
      - task: lint
      - task: test

  deps:
    desc: Sync go.mod and go.sum
    cmds:
      - go mod tidy

  clean:
    desc: Remove Air output and the default index database (it is rebuilt from the library)
    cmds:
      - rm -rf tmp/ build-errors.log homelab-search.db homelab-search.db-wal homelab-search.db-shm
