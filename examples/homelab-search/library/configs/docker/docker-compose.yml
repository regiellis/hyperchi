# Services on atlas. Data lives under /srv so the nightly backup covers it.
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_DB: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - /srv/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea"]
      interval: 10s
      retries: 5

  gitea:
    image: gitea/gitea:1.24.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
      - "2222:22"
    volumes:
      - /srv/gitea:/data

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2025.9
    restart: unless-stopped
    network_mode: host
    volumes:
      - /srv/homeassistant:/config

secrets:
  postgres_password:
    file: /srv/secrets/postgres_password
