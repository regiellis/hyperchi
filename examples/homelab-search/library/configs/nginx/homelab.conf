# Reverse proxy for lab services on atlas. TLS terminates here with the
# wildcard certificate for *.lab.home.arpa.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name *.lab.home.arpa;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ha.lab.home.arpa;

    ssl_certificate     /etc/ssl/lab/fullchain.pem;
    ssl_certificate_key /etc/ssl/lab/privkey.pem;

    location / {
        proxy_pass http://10.10.20.21:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name git.lab.home.arpa;

    ssl_certificate     /etc/ssl/lab/fullchain.pem;
    ssl_certificate_key /etc/ssl/lab/privkey.pem;
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
